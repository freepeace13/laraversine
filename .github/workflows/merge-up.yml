name: merge-up

on:
  release:
    types: [published]
  push:
    branches: [1.x, 2.x, main]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge-up:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: Set up git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # A release opens the merge-up PR (or refreshes it).
      - name: Open or refresh the merge-up PR
        if: github.event_name == 'release'
        run: bin/merge-up --from "$BRANCH"
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          BRANCH: ${{ github.event.release.target_commitish }}

      # A push only brings open merge-up PRs up to date, so they never fall behind their base.
      - name: Refresh open merge-up PRs
        if: github.event_name == 'push'
        run: bin/merge-up --refresh-only
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
